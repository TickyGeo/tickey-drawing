<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickey Drawing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="toolbar">
        <input type="color" id="color-picker" value="#000000">
        <input type="range" id="brush-size" min="1" max="50" value="5">
        <button id="brush-button" class="active">🖌️ Brush</button>
        <button id="eraser-button">🧽 Eraser</button>
        <button id="undo-button">↶ Undo</button>
        <button id="redo-button">↷ Redo</button>
        <button id="clear-button">🗑️ Clear</button>
        <button id="fill-button">🪣 Fill</button>
        <button id="download-button">💾 Download</button>
    </div>
    <canvas id="board" width="1040" height="600"></canvas>

    <script src="main.js"></script>
</body>
</html>
